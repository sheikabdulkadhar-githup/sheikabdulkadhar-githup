<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160D02">
        <animate attributeName="stop-color" values="#160D02;#2B1A05;#160D02" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="35%" stop-color="#4A2C0B">
        <animate attributeName="stop-color" values="#4A2C0B;#6B3E11;#4A2C0B" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="65%" stop-color="#8B5A2B">
        <animate attributeName="stop-color" values="#8B5A2B;#B87333;#8B5A2B" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#D4A017">
        <animate attributeName="stop-color" values="#D4A017;#FFD700;#D4A017" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#B87333" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8B5A2B" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3D2408" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1A0F02" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="300" fill="url(#bgGrad)"/>

  <!-- gold sparkles -->
  <g fill="#FFE9A8">
    <circle cx="60" cy="40" r="1.6"><animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="90" r="1.2"><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="35" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="3.8s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="70" r="1.3"><animate attributeName="opacity" values="0;1;0" dur="2.9s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="130" r="1.4"><animate attributeName="opacity" values="0;1;0" dur="3.4s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="45" r="1.7"><animate attributeName="opacity" values="0;1;0" dur="3.1s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="95" r="1.3"><animate attributeName="opacity" values="0;1;0" dur="2.7s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="30" r="1.9"><animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="80" r="1.4"><animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="130" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="3.3s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="25" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="55" r="1.2"><animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="0.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- animated title: each letter fades and rises in sequence, on a loop -->
  <text y="145" font-family="Poppins, Segoe UI, sans-serif" font-size="50" font-weight="800" fill="#FFF6E0" filter="url(#glow)" letter-spacing="1.5">
    <tspan x="161.2" opacity="0">S<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.02;0.12;0.85;1" dur="10s" begin="0s" repeatCount="indefinite"/></tspan><tspan x="196.8" opacity="0">H<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.04;0.14;0.85;1" dur="10s" begin="0s" repeatCount="indefinite"/></tspan><tspan x="236.2" opacity="0">E<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.06;0.16;0.85;1" dur="10s" begin="0s" repeatCount="indefinite"/></tspan><tspan x="269.8" opacity="0">I<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.08;0.18;0.85;1" dur="10s" begin="0s" repeatCount="indefinite"/></tspan><tspan x="287.2" opacity="0">K<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1;0.2;0.85;1" dur="10s" begin="0s" repeatCount="indefinite"/></tspan><tspan x="324.8" opacity="1"> </tspan><tspan x="342.2" opacity="0">A<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.12;0.22;0.85;1" dur="10s" begin="0s" repeatCount="indefinite"/></tspan><tspan x="381.8" opacity="0">B<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.14;0.24;0.85;1" dur="10s" begin="0s" repeatCount="indefinite"/></tspan><tspan x="419.2" opacity="0">D<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.16;0.26;0.85;1" dur="10s" begin="0s" repeatCount="indefinite"/></tspan><tspan x="458.8" opacity="0">U<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.18;0.28;0.85;1" dur="10s" begin="0s" repeatCount="indefinite"/></tspan><tspan x="498.2" opacity="0">L<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.3;0.85;1" dur="10s" begin="0s" repeatCount="indefinite"/></tspan><tspan x="531.8" opacity="1"> </tspan><tspan x="549.2" opacity="0">K<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.22;0.32;0.85;1" dur="10s" begin="0s" repeatCount="indefinite"/></tspan><tspan x="586.8" opacity="0">A<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.24;0.34;0.85;1" dur="10s" begin="0s" repeatCount="indefinite"/></tspan><tspan x="626.2" opacity="0">D<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.26;0.36;0.85;1" dur="10s" begin="0s" repeatCount="indefinite"/></tspan><tspan x="665.8" opacity="0">H<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.28;0.38;0.85;1" dur="10s" begin="0s" repeatCount="indefinite"/></tspan><tspan x="705.2" opacity="0">A<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.4;0.85;1" dur="10s" begin="0s" repeatCount="indefinite"/></tspan><tspan x="744.8" opacity="0">R<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.32;0.42;0.85;1" dur="10s" begin="0s" repeatCount="indefinite"/></tspan><tspan x="783.2" opacity="1"> </tspan><tspan x="800.8" opacity="0">N<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.34;0.44;0.85;1" dur="10s" begin="0s" repeatCount="indefinite"/></tspan>
  </text>

  <!-- subtitle -->
  <text x="500" y="182" font-family="Poppins, Segoe UI, sans-serif" font-size="18" font-weight="500"
        fill="#F0D590" text-anchor="middle" letter-spacing="0.5" opacity="0">
    &#9733; Flutter Developer &#183; AI/ML Integrator &#183; Product Engineer &#9733;
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.55;0.9;1" dur="10s" begin="0s" repeatCount="indefinite"/>
  </text>

  <!-- moving waves -->
  <path fill="url(#waveGrad1)" d="M0,300 L0,230 C 200,190 350,260 500,230 C 650,200 800,190 1000,235 L1000,300 Z">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="M0,300 L0,230 C 200,190 350,260 500,230 C 650,200 800,190 1000,235 L1000,300 Z;
              M0,300 L0,235 C 200,270 350,195 500,235 C 650,275 800,200 1000,225 L1000,300 Z;
              M0,300 L0,230 C 200,190 350,260 500,230 C 650,200 800,190 1000,235 L1000,300 Z"/>
  </path>
  <path fill="url(#waveGrad2)" d="M0,300 L0,255 C 250,220 450,290 650,250 C 800,220 900,235 1000,260 L1000,300 Z">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0,300 L0,255 C 250,220 450,290 650,250 C 800,220 900,235 1000,260 L1000,300 Z;
              M0,300 L0,260 C 250,290 450,215 650,260 C 800,290 900,220 1000,245 L1000,300 Z;
              M0,300 L0,255 C 250,220 450,290 650,250 C 800,220 900,235 1000,260 L1000,300 Z"/>
  </path>
</svg>
